<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Futty Football · Futt Sepia Games</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: #0e1a12; color: #f2f2f2;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    overflow: hidden; touch-action: none; user-select: none;
  }
  #back {
    position: fixed; top: 10px; left: 12px; color: #f2f2f2; text-decoration: none;
    font-size: 14px; font-weight: 600; opacity: .8; padding: 6px 10px; border-radius: 6px;
    border: 1px solid rgba(255,255,255,.3);
  }
  #back:hover { opacity: 1; background: rgba(255,255,255,.1); }
  #hud {
    display: flex; gap: 24px; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 700; margin: 8px 0;
  }
  .team { display: flex; align-items: center; gap: 8px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
  #timer { font-variant-numeric: tabular-nums; color: #ffd84d; min-width: 64px; text-align: center; }
  #wrap { position: relative; width: min(96vw, calc((100vh - 110px) * 900 / 560)); aspect-ratio: 900 / 560; }
  canvas { width: 100%; height: 100%; display: block; border-radius: 10px; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
  #overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: rgba(0,0,0,.55); border-radius: 10px; text-align: center; padding: 16px;
  }
  #overlay.hidden { display: none; }
  #overlay h1 { margin: 0; font-size: clamp(28px, 6vw, 52px); letter-spacing: 2px; }
  #overlay p { margin: 0; opacity: .9; font-size: clamp(13px, 2vw, 17px); line-height: 1.5; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  button {
    font: inherit; font-weight: 700; font-size: 16px; cursor: pointer;
    padding: 10px 20px; border-radius: 8px; border: 2px solid #fff;
    background: transparent; color: #fff;
  }
  button.sel, button:hover { background: #fff; color: #0e1a12; }
  #help { font-size: 13px; opacity: .7; margin-top: 6px; text-align: center; padding: 0 12px; }
  #shootBtn {
    position: absolute; right: 14px; bottom: 14px; width: 74px; height: 74px;
    border-radius: 50%; background: rgba(255,255,255,.22); border: 2px solid rgba(255,255,255,.6);
    color: #fff; font-weight: 800; display: none; align-items: center; justify-content: center;
  }
  @media (pointer: coarse) { #shootBtn { display: flex; } }
</style>
</head>
<body>
  <a id="back" href="../../index.html">← Games</a>
  <div id="hud">
    <div class="team"><span class="dot" style="background:#3b8bff"></span>YOU <span id="sP">0</span></div>
    <div id="timer">1:30</div>
    <div class="team"><span id="sA">0</span> CPU<span class="dot" style="background:#ff4d4d"></span></div>
  </div>
  <div id="wrap">
    <canvas id="c" width="900" height="560"></canvas>
    <div id="shootBtn">KICK</div>
    <div id="overlay">
      <h1>⚽ FUTTY</h1>
      <p>Score in the right goal. Beat the CPU before the clock runs out.</p>
      <div class="row" id="diff">
        <button data-d="0">Easy</button>
        <button data-d="1" class="sel">Normal</button>
        <button data-d="2">Hard</button>
      </div>
      <button id="startBtn">Kick Off</button>
    </div>
  </div>
  <div id="help">Move: Arrows / WASD &nbsp;·&nbsp; Kick: Space (hold for power) &nbsp;·&nbsp; Pause: P &nbsp;·&nbsp; Touch: drag to move, KICK to shoot</div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const W = 900, H = 560;
  const M = 40;                       // margin around the pitch (goal depth)
  const L = M, R = W - M, T = M, B = H - M;
  const GOAL_H = 150, GT = H / 2 - GOAL_H / 2, GB = H / 2 + GOAL_H / 2;
  const MATCH_TIME = 90;

  const $ = id => document.getElementById(id);
  const overlay = $('overlay');

  const DIFF = [
    { speed: 2.4, kick: 8,  react: 0.55 },
    { speed: 3.0, kick: 10, react: 0.8 },
    { speed: 3.5, kick: 12, react: 1.0 },
  ];
  let diff = 1;

  const player = { x: 0, y: 0, vx: 0, vy: 0, r: 16, color: '#3b8bff', fx: 1, fy: 0, speed: 3.6 };
  const cpu    = { x: 0, y: 0, vx: 0, vy: 0, r: 16, color: '#ff4d4d', cooldown: 0 };
  const ball   = { x: 0, y: 0, vx: 0, vy: 0, r: 9, spin: 0 };

  let score = { p: 0, a: 0 };
  let timeLeft = MATCH_TIME;
  let state = 'menu';                 // menu | play | goal | pause | over
  let stateTimer = 0, message = '';
  let charge = 0, charging = false;

  // ---------- input ----------
  const keys = {};
  addEventListener('keydown', e => {
    keys[e.code] = true;
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
    if (e.code === 'Space' && state === 'play' && !charging) { charging = true; charge = 0; }
    if (e.code === 'KeyP') togglePause();
    if (e.code === 'Enter' && (state === 'menu' || state === 'over')) startMatch();
  });
  addEventListener('keyup', e => {
    keys[e.code] = false;
    if (e.code === 'Space' && charging) { charging = false; tryKick(player, charge); }
  });

  // touch: drag anywhere on the canvas acts as a joystick
  let touch = null;
  canvas.addEventListener('pointerdown', e => {
    touch = { id: e.pointerId, sx: e.clientX, sy: e.clientY, dx: 0, dy: 0 };
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', e => {
    if (!touch || touch.id !== e.pointerId) return;
    touch.dx = e.clientX - touch.sx; touch.dy = e.clientY - touch.sy;
  });
  const endTouch = e => { if (touch && touch.id === e.pointerId) touch = null; };
  canvas.addEventListener('pointerup', endTouch);
  canvas.addEventListener('pointercancel', endTouch);
  const shootBtn = $('shootBtn');
  shootBtn.addEventListener('pointerdown', e => { e.preventDefault(); if (state === 'play') { charging = true; charge = 0; } });
  shootBtn.addEventListener('pointerup', () => { if (charging) { charging = false; tryKick(player, charge); } });

  document.querySelectorAll('#diff button').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('#diff button').forEach(x => x.classList.remove('sel'));
    b.classList.add('sel'); diff = +b.dataset.d;
  }));
  $('startBtn').addEventListener('click', startMatch);

  // ---------- sound ----------
  let actx = null;
  function beep(freq, dur, type = 'square', vol = 0.08) {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.connect(g).connect(actx.destination);
      o.start(); o.stop(actx.currentTime + dur);
    } catch (_) {}
  }
  const whistle = () => { beep(2100, 0.25, 'sine', 0.1); setTimeout(() => beep(2100, 0.4, 'sine', 0.1), 300); };

  // ---------- game flow ----------
  function startMatch() {
    score = { p: 0, a: 0 };
    timeLeft = MATCH_TIME;
    overlay.classList.add('hidden');
    kickoff();
    whistle();
  }

  function kickoff() {
    player.x = W / 2 - 120; player.y = H / 2; player.vx = player.vy = 0; player.fx = 1; player.fy = 0;
    cpu.x = W / 2 + 120;    cpu.y = H / 2;    cpu.vx = cpu.vy = 0; cpu.cooldown = 1.0;
    ball.x = W / 2; ball.y = H / 2; ball.vx = ball.vy = 0;
    charging = false; charge = 0;
    state = 'play';
    updateHud();
  }

  function togglePause() {
    if (state === 'play') { state = 'pause'; message = 'PAUSED'; }
    else if (state === 'pause') state = 'play';
  }

  function goalScored(byPlayer) {
    if (byPlayer) score.p++; else score.a++;
    updateHud();
    state = 'goal'; stateTimer = 1.8;
    message = byPlayer ? 'GOAL!' : 'CPU SCORES';
    beep(byPlayer ? 660 : 220, 0.15); setTimeout(() => beep(byPlayer ? 880 : 180, 0.3), 150);
  }

  function endMatch() {
    state = 'over';
    whistle();
    const res = score.p > score.a ? 'You win! 🏆' : score.p < score.a ? 'You lose 😞' : 'Draw 🤝';
    overlay.querySelector('h1').textContent = res;
    overlay.querySelector('p').textContent = `Final score  ${score.p} – ${score.a}`;
    $('startBtn').textContent = 'Play Again';
    // record W/D/L for the dashboard
    try {
      const rec = JSON.parse(localStorage.getItem('fsg.football') || '{"w":0,"d":0,"l":0}');
      rec[score.p > score.a ? 'w' : score.p < score.a ? 'l' : 'd']++;
      localStorage.setItem('fsg.football', JSON.stringify(rec));
    } catch (_) {}
    overlay.classList.remove('hidden');
  }

  function updateHud() {
    $('sP').textContent = score.p; $('sA').textContent = score.a;
    const t = Math.max(0, Math.ceil(timeLeft));
    $('timer').textContent = `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`;
  }

  // ---------- physics helpers ----------
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const len = (x, y) => Math.hypot(x, y) || 1;

  function tryKick(p, power) {
    const dx = ball.x - p.x, dy = ball.y - p.y, d = len(dx, dy);
    if (d > p.r + ball.r + 12) return false;
    let dirx, diry;
    if (p === player) {
      // kick toward facing direction, blended with contact direction
      dirx = p.fx * 0.7 + (dx / d) * 0.3; diry = p.fy * 0.7 + (dy / d) * 0.3;
    } else { dirx = dx; diry = dy; }
    const n = len(dirx, diry);
    const strength = p === player ? 8 + 8 * clamp(power, 0, 1) : DIFF[diff].kick;
    ball.vx = (dirx / n) * strength; ball.vy = (diry / n) * strength;
    beep(140, 0.08, 'triangle', 0.15);
    return true;
  }

  function moveBody(p, ax, ay, max, dt) {
    p.vx += ax * 0.6 * dt; p.vy += ay * 0.6 * dt;
    const s = len(p.vx, p.vy);
    if (s > max) { p.vx = p.vx / s * max; p.vy = p.vy / s * max; }
    if (!ax) p.vx *= Math.pow(0.82, dt);
    if (!ay) p.vy *= Math.pow(0.82, dt);
    p.x = clamp(p.x + p.vx * dt, L + p.r, R - p.r);
    p.y = clamp(p.y + p.vy * dt, T + p.r, B - p.r);
  }

  function collideBall(p) {
    const dx = ball.x - p.x, dy = ball.y - p.y, d = Math.hypot(dx, dy), min = p.r + ball.r;
    if (d < min && d > 0) {
      const nx = dx / d, ny = dy / d;
      ball.x = p.x + nx * min; ball.y = p.y + ny * min;
      // dribble: ball takes on player's velocity plus a small push
      const rel = (ball.vx - p.vx) * nx + (ball.vy - p.vy) * ny;
      if (rel < 0) { ball.vx -= 1.5 * rel * nx; ball.vy -= 1.5 * rel * ny; }
      ball.vx += p.vx * 0.15 + nx * 0.6; ball.vy += p.vy * 0.15 + ny * 0.6;
    }
  }

  function collideBodies(a, b) {
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), min = a.r + b.r;
    if (d < min && d > 0) {
      const push = (min - d) / 2, nx = dx / d, ny = dy / d;
      a.x -= nx * push; a.y -= ny * push; b.x += nx * push; b.y += ny * push;
    }
  }

  // ---------- CPU AI ----------
  function updateCpu(dt) {
    const D = DIFF[diff];
    const goalX = L, goalY = H / 2;          // CPU attacks the left goal
    // aim point: just behind the ball on the line from goal to ball
    let gx = ball.x - goalX, gy = ball.y - goalY, gd = len(gx, gy);
    let tx = ball.x + (gx / gd) * (cpu.r + ball.r + 2);
    let ty = ball.y + (gy / gd) * (cpu.r + ball.r + 2);

    // if ball is behind the CPU (closer to CPU's own goal), circle around it
    if (ball.x > cpu.x + 4) { tx = ball.x + 30; ty = ball.y + (cpu.y < ball.y ? -30 : 30); }

    // defend: if player has the ball deep in CPU's half, drop back toward own goal
    const pd = Math.hypot(ball.x - player.x, ball.y - player.y);
    if (pd < 40 && ball.x > W * 0.6 && ball.x < cpu.x) {
      tx = (ball.x + R) / 2; ty = (ball.y + H / 2) / 2;
    }

    let ax = tx - cpu.x, ay = ty - cpu.y; const ad = Math.hypot(ax, ay);
    if (ad > 3) { ax /= ad; ay /= ad; } else { ax = ay = 0; }
    moveBody(cpu, ax * D.react, ay * D.react, D.speed, dt);

    cpu.cooldown -= dt / 60;
    const bd = Math.hypot(ball.x - cpu.x, ball.y - cpu.y);
    const facingGoal = ball.x < cpu.x;
    if (cpu.cooldown <= 0 && bd < cpu.r + ball.r + 6 && facingGoal) {
      const dist = ball.x - L;
      if (dist < 380 || Math.random() < 0.02 * D.react) {
        // aim at a random spot inside the goal mouth
        const aimY = GT + 20 + Math.random() * (GOAL_H - 40);
        const dx = L - 10 - ball.x, dy = aimY - ball.y, n = len(dx, dy);
        ball.vx = dx / n * D.kick; ball.vy = dy / n * D.kick;
        beep(120, 0.08, 'triangle', 0.15);
        cpu.cooldown = 0.7;
      }
    }
  }

  // ---------- update ----------
  function update(dt) {
    if (state === 'goal') {
      stateTimer -= dt / 60;
      stepBall(dt, false);
      if (stateTimer <= 0) { if (timeLeft <= 0) endMatch(); else { kickoff(); whistle(); } }
      return;
    }
    if (state !== 'play') return;

    timeLeft -= dt / 60;
    updateHud();
    if (timeLeft <= 0) { endMatch(); return; }

    // player input
    let ix = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
    let iy = (keys.ArrowDown || keys.KeyS ? 1 : 0) - (keys.ArrowUp || keys.KeyW ? 1 : 0);
    if (touch) {
      const m = Math.hypot(touch.dx, touch.dy);
      if (m > 10) { ix = touch.dx / m; iy = touch.dy / m; }
    }
    if (ix || iy) { const n = len(ix, iy); ix /= n; iy /= n; player.fx = ix; player.fy = iy; }
    moveBody(player, ix, iy, charging ? player.speed * 0.7 : player.speed, dt);

    if (charging) charge = Math.min(1, charge + dt / 50);

    updateCpu(dt);
    collideBodies(player, cpu);
    stepBall(dt, true);
  }

  function stepBall(dt, live) {
    collideBall(player); collideBall(cpu);
    const sp = Math.hypot(ball.vx, ball.vy);
    if (sp > 16) { ball.vx *= 16 / sp; ball.vy *= 16 / sp; }
    ball.x += ball.vx * dt; ball.y += ball.vy * dt;
    const f = Math.pow(0.985, dt);
    ball.vx *= f; ball.vy *= f;
    ball.spin += sp * dt * 0.05;

    const inMouth = ball.y > GT + ball.r && ball.y < GB - ball.r;
    // top / bottom
    if (ball.y < T + ball.r && !(ball.x < L || ball.x > R)) { ball.y = T + ball.r; ball.vy = Math.abs(ball.vy) * 0.8; }
    if (ball.y > B - ball.r && !(ball.x < L || ball.x > R)) { ball.y = B - ball.r; ball.vy = -Math.abs(ball.vy) * 0.8; }
    // side lines (unless in goal mouth)
    if (ball.x < L + ball.r && !inMouth && ball.x > L - ball.r) { ball.x = L + ball.r; ball.vx = Math.abs(ball.vx) * 0.8; }
    if (ball.x > R - ball.r && !inMouth && ball.x < R + ball.r) { ball.x = R - ball.r; ball.vx = -Math.abs(ball.vx) * 0.8; }
    // inside the net: keep ball in the goal box
    if (ball.x < L || ball.x > R) {
      ball.y = clamp(ball.y, GT + ball.r, GB - ball.r);
      if (ball.x < L - M + 8 + ball.r) { ball.x = L - M + 8 + ball.r; ball.vx = 0; }
      if (ball.x > R + M - 8 - ball.r) { ball.x = R + M - 8 - ball.r; ball.vx = 0; }
      ball.vx *= 0.9; ball.vy *= 0.9;
    }
    if (live) {
      if (ball.x < L - ball.r) goalScored(false);
      else if (ball.x > R + ball.r) goalScored(true);
    }
  }

  // ---------- render ----------
  function drawPitch() {
    // stripes
    for (let i = 0; i < 12; i++) {
      ctx.fillStyle = i % 2 ? '#2f8a3e' : '#349645';
      ctx.fillRect(i * W / 12, 0, W / 12 + 1, H);
    }
    ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 3;
    ctx.strokeRect(L, T, R - L, B - T);
    ctx.beginPath(); ctx.moveTo(W / 2, T); ctx.lineTo(W / 2, B); ctx.stroke();
    ctx.beginPath(); ctx.arc(W / 2, H / 2, 70, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(W / 2, H / 2, 4, 0, Math.PI * 2); ctx.fill();
    // penalty boxes
    ctx.strokeRect(L, H / 2 - 130, 110, 260);
    ctx.strokeRect(R - 110, H / 2 - 130, 110, 260);
    ctx.strokeRect(L, H / 2 - 60, 40, 120);
    ctx.strokeRect(R - 40, H / 2 - 60, 40, 120);
    ctx.beginPath(); ctx.arc(L + 110, H / 2, 45, -Math.PI / 2, Math.PI / 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(R - 110, H / 2, 45, Math.PI / 2, Math.PI * 1.5); ctx.stroke();
    // goals with nets
    for (const [x0, dir] of [[L, -1], [R, 1]]) {
      const x1 = x0 + dir * (M - 8);
      ctx.fillStyle = 'rgba(255,255,255,.12)';
      ctx.fillRect(Math.min(x0, x1), GT, M - 8, GOAL_H);
      ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1;
      for (let y = GT; y <= GB; y += 10) { ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke(); }
      for (let k = 0; k <= M - 8; k += 8) { ctx.beginPath(); ctx.moveTo(x0 + dir * k, GT); ctx.lineTo(x0 + dir * k, GB); ctx.stroke(); }
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(x0, GT); ctx.lineTo(x1, GT); ctx.lineTo(x1, GB); ctx.lineTo(x0, GB); ctx.stroke();
    }
  }

  function drawPlayer(p, label) {
    ctx.fillStyle = 'rgba(0,0,0,.25)';
    ctx.beginPath(); ctx.ellipse(p.x + 3, p.y + 5, p.r, p.r * 0.8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = '#fff'; ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 12px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(label, p.x, p.y + 1);
  }

  function drawBall() {
    ctx.fillStyle = 'rgba(0,0,0,.3)';
    ctx.beginPath(); ctx.ellipse(ball.x + 3, ball.y + 4, ball.r, ball.r * 0.7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#222'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = '#222';
    for (let i = 0; i < 3; i++) {
      const a = ball.spin + i * (Math.PI * 2 / 3);
      ctx.beginPath(); ctx.arc(ball.x + Math.cos(a) * 4.5, ball.y + Math.sin(a) * 4.5, 2.2, 0, Math.PI * 2); ctx.fill();
    }
  }

  function render() {
    drawPitch();
    // aim indicator / power bar
    if (state === 'play' || state === 'pause') {
      ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(player.x + player.fx * (player.r + 4), player.y + player.fy * (player.r + 4));
      ctx.lineTo(player.x + player.fx * (player.r + 14), player.y + player.fy * (player.r + 14));
      ctx.stroke();
      if (charging) {
        ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(player.x - 20, player.y - 32, 40, 6);
        ctx.fillStyle = `hsl(${120 - charge * 120},90%,55%)`; ctx.fillRect(player.x - 20, player.y - 32, 40 * charge, 6);
      }
    }
    drawPlayer(cpu, 'C');
    drawPlayer(player, 'P');
    drawBall();
    if (state === 'goal' || state === 'pause') {
      ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(0, H / 2 - 50, W, 100);
      ctx.fillStyle = state === 'goal' && message === 'GOAL!' ? '#ffd84d' : '#fff';
      ctx.font = 'bold 64px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(message, W / 2, H / 2);
    }
  }

  // ---------- loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(3, (now - last) / (1000 / 60)); // dt in 60fps frames
    last = now;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }
  kickoff(); state = 'menu';
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
