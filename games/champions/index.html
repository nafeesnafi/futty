<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Futt Champions · Futt Sepia Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;800&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* Night-match broadcast look: deep navy, silver type, a gold "star" accent */
  :root {
    --night: #070d24; --navy: #0f1c46; --panel: rgba(9, 18, 52, .86); --line: rgba(190, 205, 255, .22);
    --silver: #e8ecf7; --muted: #9aa6c8; --gold: #f0c35a; --you: #38bdf8; --them: #ff5d5d; --good: #4ade80;
    --display: "Saira Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
    --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--night); color: var(--silver); font-family: var(--body); }
  body { touch-action: none; user-select: none; -webkit-user-select: none; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .hidden { display: none !important; }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; }
  .scoreboard {
    position: absolute; top: max(12px, env(safe-area-inset-top)); left: max(12px, env(safe-area-inset-left));
    display: flex; align-items: stretch; font-family: var(--display); font-weight: 800; font-size: 22px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden;
    box-shadow: 0 6px 20px rgba(0,0,0,.35);
  }
  .sb-team { display: flex; align-items: center; gap: 8px; padding: 4px 12px; letter-spacing: .5px; }
  .sb-kit { width: 12px; height: 22px; border-radius: 2px; border: 1px solid rgba(255,255,255,.4); }
  .sb-red { color: #ff4d4d; font-size: 16px; letter-spacing: 1px; }
  .sb-red:empty { display: none; }
  .sb-score { background: var(--silver); color: var(--night); padding: 4px 12px; font-variant-numeric: tabular-nums; }
  .sb-clock { padding: 4px 12px; color: var(--gold); font-variant-numeric: tabular-nums; min-width: 56px; text-align: center; border-left: 1px solid var(--line); }
  #netStat { position: absolute; top: max(12px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); font-size: 13px; color: var(--muted); background: var(--panel); padding: 4px 10px; border-radius: 6px; }
  #banner {
    position: absolute; left: 50%; top: 26%; transform: translate(-50%, -50%);
    font-family: var(--display); font-weight: 800; text-align: center; text-shadow: 0 4px 24px rgba(0,0,0,.6);
    opacity: 0; transition: opacity .25s, transform .25s; white-space: nowrap;
  }
  #banner.show { opacity: 1; transform: translate(-50%, -50%) scale(1.04); }
  #banner .big { font-size: clamp(44px, 10vw, 110px); line-height: .95; letter-spacing: 2px; color: var(--gold); }
  #banner .small { font-size: clamp(16px, 2.6vw, 24px); color: var(--silver); letter-spacing: 1px; }
  #hint {
    position: absolute; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--line); padding: 6px 14px; border-radius: 999px; font-size: 14px;
    opacity: 0; transition: opacity .3s; white-space: nowrap;
  }
  #hint.show { opacity: 1; }
  #replayTag { position: absolute; top: max(14px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); font-family: var(--display); font-weight: 800; letter-spacing: 3px; color: var(--gold); background: var(--panel); border: 1px solid var(--line); padding: 4px 14px; border-radius: 6px; opacity: 0; transition: opacity .2s; }
  #replayTag.show { opacity: 1; }
  #power { position: absolute; left: 50%; bottom: max(58px, calc(env(safe-area-inset-bottom) + 50px)); transform: translateX(-50%); width: 220px; height: 10px; border-radius: 6px; background: rgba(0,0,0,.5); border: 1px solid var(--line); overflow: hidden; opacity: 0; }
  #power.show { opacity: 1; }
  #power i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--good), var(--gold) 70%, var(--them)); }
  #radar { position: absolute; right: max(12px, env(safe-area-inset-right)); bottom: max(12px, env(safe-area-inset-bottom)); width: 210px; height: 136px; border-radius: 6px; border: 1px solid var(--line); background: rgba(20, 70, 35, .55); }

  /* ---------- touch controls ---------- */
  #touch { position: fixed; inset: 0; pointer-events: none; display: none; }
  body.touch.playing #touch { display: block; }
  body.touch.playing #radar { width: 150px; height: 97px; top: max(54px, env(safe-area-inset-top)); bottom: auto; }
  body { --tb: 64px; --st: 128px; }
  body.touch-s { --tb: 54px; --st: 108px; } body.touch-l { --tb: 76px; --st: 152px; }
  .stick { position: absolute; left: max(22px, env(safe-area-inset-left)); bottom: max(22px, env(safe-area-inset-bottom)); width: var(--st); height: var(--st); border-radius: 50%; background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.35); pointer-events: auto; }
  .knob { position: absolute; left: calc((var(--st) - 50px) / 2); top: calc((var(--st) - 50px) / 2); width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,.75); }
  .tbtns { position: absolute; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); display: grid; grid-template-columns: repeat(3, var(--tb)); gap: 10px; pointer-events: auto; }
  body.touch-swap .stick { left: auto; right: max(22px, env(safe-area-inset-right)); }
  body.touch-swap .tbtns { right: auto; left: max(16px, env(safe-area-inset-left)); }
  .tbtn { width: var(--tb); height: var(--tb); border-radius: 50%; border: 2px solid rgba(255,255,255,.5); background: rgba(15, 28, 70, .65); font-family: var(--display); font-weight: 800; font-size: 14px; letter-spacing: .5px; }
  .tbtn.down { background: rgba(240, 195, 90, .7); color: var(--night); }
  .tbtn.shoot { background: rgba(255, 93, 93, .55); }
  #touchPause { position: absolute; top: max(12px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); pointer-events: auto; width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); }

  /* ---------- screens ---------- */
  .screen {
    position: fixed; inset: 0; overflow-y: auto; display: flex; flex-direction: column; align-items: center;
    padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    background: linear-gradient(180deg, rgba(7,13,36,.55), rgba(7,13,36,.88));
  }
  .screen.center { justify-content: center; }
  .wrap { width: 100%; max-width: 980px; display: flex; flex-direction: column; gap: 18px; }
  .back { position: fixed; top: max(12px, env(safe-area-inset-top)); left: max(12px, env(safe-area-inset-left)); color: var(--silver); text-decoration: none; font-weight: 600; font-size: 14px; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); z-index: 5; }
  .logo { font-family: var(--display); font-weight: 800; text-align: center; line-height: .9; }
  .logo .star { color: var(--gold); font-size: 28px; letter-spacing: 8px; }
  .logo h1 { margin: 6px 0 4px; font-size: clamp(54px, 12vw, 112px); letter-spacing: 3px; background: linear-gradient(180deg, #ffffff, #b9c3e0); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .logo p { margin: 0; font-family: var(--body); font-weight: 600; color: var(--muted); letter-spacing: 3px; text-transform: uppercase; font-size: 13px; }
  .menu { display: flex; flex-direction: column; gap: 10px; width: min(360px, 100%); margin: 26px auto 0; }
  .mbtn {
    display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--panel); font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: 1px; text-align: left;
  }
  .mbtn small { font-family: var(--body); font-weight: 600; font-size: 12px; color: var(--muted); letter-spacing: 0; }
  .mbtn:hover, .mbtn:focus-visible { border-color: var(--gold); background: rgba(240,195,90,.12); }
  .mbtn.primary { background: var(--gold); color: var(--night); border-color: var(--gold); }
  .mbtn.primary small { color: rgba(7,13,36,.7); }
  .record { text-align: center; color: var(--muted); font-size: 14px; margin-top: 10px; font-variant-numeric: tabular-nums; }
  h2 { font-family: var(--display); font-weight: 800; font-size: 34px; letter-spacing: 1px; margin: 0; text-wrap: balance; }
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding-top: 34px; }

  .matchup { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: stretch; }
  .side {
    border: 2px solid var(--line); border-radius: 12px; background: var(--panel); padding: 14px; display: flex; gap: 12px; align-items: center; text-align: left; min-width: 0;
  }
  .side.picking { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(240,195,90,.18); }
  .side .shirt { width: 44px; height: 54px; border-radius: 6px 6px 4px 4px; flex: none; border: 1px solid rgba(255,255,255,.35); }
  .side .lbl { font-size: 11px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; font-weight: 700; }
  .side .nm { font-family: var(--display); font-weight: 800; font-size: 24px; line-height: 1.05; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .side .rt { font-size: 13px; color: var(--muted); }
  .vs { align-self: center; font-family: var(--display); font-weight: 800; color: var(--gold); font-size: 26px; }
  .opts { display: flex; gap: 18px; flex-wrap: wrap; align-items: center; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; background: transparent; padding: 8px 14px; font-weight: 700; font-size: 14px; }
  .seg button.on { background: var(--silver); color: var(--night); }
  .optlbl { font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-right: 8px; }
  .search { flex: 1; min-width: 160px; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); background: rgba(0,0,0,.25); color: var(--silver); font: inherit; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .club { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: rgba(9,18,52,.7); text-align: left; min-width: 0; }
  .club:hover, .club:focus-visible { border-color: var(--silver); }
  .club.sel-you { border-color: var(--you); box-shadow: inset 0 0 0 1px var(--you); }
  .club.sel-them { border-color: var(--them); box-shadow: inset 0 0 0 1px var(--them); }
  .club .shirt { width: 22px; height: 28px; border-radius: 4px 4px 2px 2px; flex: none; border: 1px solid rgba(255,255,255,.35); }
  .club .cn { font-weight: 700; font-size: 14px; line-height: 1.15; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .club .cm { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .club > div { min-width: 0; }
  .actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; position: sticky; bottom: 0; padding: 12px 0 4px; background: linear-gradient(180deg, transparent, rgba(7,13,36,.95) 40%); }
  .btn { padding: 12px 22px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); font-family: var(--display); font-weight: 800; font-size: 20px; letter-spacing: 1px; }
  .btn.primary { background: var(--gold); color: var(--night); border-color: var(--gold); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  .card { width: min(520px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; gap: 14px; }
  .result { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; font-family: var(--display); font-weight: 800; }
  .result .t { font-size: 22px; text-align: center; overflow: hidden; text-overflow: ellipsis; }
  .result .s { font-size: 54px; color: var(--gold); font-variant-numeric: tabular-nums; }
  .stats { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  .stats td { padding: 6px 4px; border-top: 1px solid var(--line); }
  .stats td:first-child, .stats td:last-child { width: 60px; font-weight: 700; }
  .stats td:last-child { text-align: right; }
  .stats td:nth-child(2) { text-align: center; color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
  .scorers { color: var(--muted); font-size: 14px; text-align: center; }
  .keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 15px; }
  .keys kbd { font-family: var(--body); font-weight: 700; background: rgba(255,255,255,.1); border: 1px solid var(--line); border-radius: 5px; padding: 1px 7px; font-size: 13px; white-space: nowrap; }
  .note { color: var(--muted); font-size: 13px; line-height: 1.5; margin: 0; }
  .sb-ment { padding: 4px 10px; border-left: 1px solid var(--line); font-size: 15px; color: var(--muted); display: flex; align-items: center; }
  .sb-ment.att { color: #ff8a65; } .sb-ment.def { color: #7dd3fc; }
  #stamina { position: absolute; left: max(12px, env(safe-area-inset-left)); top: calc(max(12px, env(safe-area-inset-top)) + 46px); display: flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: 1.5px; font-weight: 700; color: var(--muted); }
  #stamina i { width: 120px; height: 7px; background: rgba(0,0,0,.45); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  #stamina b { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--them), var(--gold) 40%, var(--good)); background-size: 120px 100%; }
  #stamina.hidden-bar { visibility: hidden; }
  #soBoard { position: absolute; top: calc(max(12px, env(safe-area-inset-top)) + 46px); left: 50%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; display: grid; grid-template-columns: auto auto auto; gap: 4px 12px; align-items: center; font-family: var(--display); font-weight: 800; font-size: 18px; }
  #soBoard .dots { display: flex; gap: 5px; }
  #soBoard .dot { width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--muted); }
  #soBoard .dot.g { background: var(--good); border-color: var(--good); }
  #soBoard .dot.x { background: var(--them); border-color: var(--them); }
  #touchTac { position: absolute; top: max(12px, env(safe-area-inset-top)); right: calc(max(12px, env(safe-area-inset-right)) + 48px); pointer-events: auto; height: 40px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); font-family: var(--display); font-weight: 800; }
  .bracket { display: grid; grid-template-columns: repeat(4, minmax(150px, 1fr)); gap: 14px; overflow-x: auto; padding-bottom: 6px; }
  .round { display: flex; flex-direction: column; gap: 8px; justify-content: space-around; min-width: 0; }
  .tie { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; display: flex; flex-direction: column; gap: 2px; }
  .tie.mine { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
  .tie.tbd { color: var(--muted); font-size: 13px; padding: 10px; text-align: center; }
  .bt { display: grid; grid-template-columns: 16px 1fr auto; gap: 8px; align-items: center; font-weight: 700; font-size: 14px; }
  .bt .shirt { width: 14px; height: 18px; border-radius: 3px; border: 1px solid rgba(255,255,255,.35); }
  .bt.lose { opacity: .45; } .bt.win .bn { color: var(--gold); }
  .bt .bs { font-variant-numeric: tabular-nums; } .bt small { color: var(--muted); margin-left: 3px; font-weight: 600; }
  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .trophy-card { align-items: center; text-align: center; position: relative; }
  .trophy { width: 140px; height: 175px; filter: drop-shadow(0 8px 24px rgba(240,195,90,.45)); }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
  .tabs button { border: 0; background: transparent; padding: 10px 14px; font-weight: 700; color: var(--muted); border-bottom: 3px solid transparent; }
  .tabs button.on { color: var(--silver); border-bottom-color: var(--gold); }
  .binds { display: grid; gap: 6px; }
  .bh, .bindrow { display: grid; grid-template-columns: minmax(0, 1fr) 120px 120px; gap: 8px; align-items: center; }
  .bh { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .bindrow { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
  .bl { font-size: 14px; min-width: 0; }
  .slot { padding: 8px 6px; border-radius: 6px; border: 1px solid var(--line); background: rgba(255,255,255,.06); font-weight: 700; font-family: var(--body); }
  .slot:hover { border-color: var(--silver); }
  .slot.empty { color: var(--muted); }
  .slot.listening { border-color: var(--gold); color: var(--gold); background: rgba(240,195,90,.12); }
  .warn { color: #ffb4b4; font-size: 14px; margin: 0; }
  .ctlnote { color: var(--good); }
  .optgrid { display: grid; grid-template-columns: auto 1fr; gap: 14px 18px; align-items: center; }
  .optgrid .note { display: block; margin-top: 6px; }
  .btn.danger { border-color: var(--them); color: #ffb4b4; }
  @media (max-width: 640px) {
    .bh, .bindrow { grid-template-columns: minmax(0, 1fr) 84px 84px; }
    .optgrid { grid-template-columns: 1fr; }
    .matchup { grid-template-columns: 1fr; }
    .vs { display: none; }
    #radar { width: 150px; height: 97px; }
    .sb-ment { display: none; }
    .scoreboard { font-size: 18px; }
  }
  @media (prefers-reduced-motion: reduce) { #banner, #hint { transition: none; } }
</style>
</head>
<body>
<div id="stage"></div>

<div id="hud" class="hidden">
  <div class="scoreboard">
    <div class="sb-team"><span class="sb-kit" id="sbKitH"></span><span id="sbH">HOM</span><span class="sb-red" id="sbRedH"></span></div>
    <div class="sb-score"><span id="sbScore">0 - 0</span></div>
    <div class="sb-team"><span class="sb-red" id="sbRedA"></span><span id="sbA">AWY</span><span class="sb-kit" id="sbKitA"></span></div>
    <div class="sb-clock" id="sbClock">0'</div>
    <div class="sb-ment" id="sbMent" title="Your team's mentality (1 / 2 / 3)">BAL</div>
  </div>
  <div id="soBoard" class="hidden"></div>
  <div id="stamina"><span>STAMINA</span><i><b id="staminaFill"></b></i></div>
  <div id="netStat" class="hidden"></div>
  <div id="banner"><div class="big" id="bnBig"></div><div class="small" id="bnSmall"></div></div>
  <div id="power"><i id="powerFill"></i></div>
  <div id="hint"></div>
  <div id="replayTag">● REPLAY</div>
  <canvas id="radar" width="420" height="272"></canvas>
</div>

<div id="touch">
  <div class="stick"><div class="knob"></div></div>
  <div class="tbtns">
    <button class="tbtn" data-act="switch">SWITCH</button>
    <button class="tbtn" data-act="through">THRU</button>
    <button class="tbtn" data-act="sprint">SPRINT</button>
    <button class="tbtn" data-act="lob">LOB</button>
    <button class="tbtn" data-act="pass">PASS</button>
    <button class="tbtn shoot" data-act="shoot">SHOOT</button>
  </div>
  <button id="touchPause" aria-label="Pause">❚❚</button>
  <button id="touchTac" aria-label="Change mentality">BAL</button>
</div>

<!-- main menu -->
<section class="screen center" id="scrTitle">
  <a class="back" href="../../index.html">← Games</a>
  <div class="wrap">
    <div class="logo">
      <div class="star">★ ★ ★</div>
      <h1>FUTT CHAMPIONS</h1>
      <p>36 clubs · one night · 11 v 11</p>
    </div>
    <div class="menu">
      <button class="mbtn primary" id="btnBot">Play vs Bot <small>Kick off against the CPU</small></button>
      <button class="mbtn" id="btnCup">Champions Cup <small id="cupSub">16-club knockout</small></button>
      <button class="mbtn" id="btnShootout">Penalty Shootout <small>Five kicks each, then sudden death</small></button>
      <button class="mbtn" id="btnOnline">Play Online <small>Invite a friend with a code</small></button>
      <button class="mbtn" id="btnControls">Controls <small>Change keys, buttons and touch layout</small></button>
    </div>
    <div class="record" id="record"></div>
  </div>
</section>

<!-- team select -->
<section class="screen hidden" id="scrTeams">
  <div class="wrap">
    <div class="topbar">
      <h2 id="teamsTitle">Choose your clubs</h2>
      <button class="btn" id="teamsBack">Back</button>
    </div>
    <div class="matchup">
      <button class="side picking" id="sideYou"><span class="shirt"></span><span><div class="lbl">You</div><div class="nm">—</div><div class="rt"></div></span></button>
      <div class="vs">VS</div>
      <button class="side" id="sideThem"><span class="shirt"></span><span><div class="lbl">Opponent</div><div class="nm">—</div><div class="rt"></div></span></button>
    </div>
    <div class="opts" id="botOpts">
      <span><span class="optlbl">Difficulty</span><span class="seg" id="segDiff"><button data-v="easy">Easy</button><button data-v="normal" class="on">Normal</button><button data-v="hard">Hard</button></span></span>
      <span><span class="optlbl">Match</span><span class="seg" id="segLen"><button data-v="90">3 min</button><button data-v="180" class="on">6 min</button><button data-v="300">10 min</button></span></span>
      <button class="btn" id="btnRandom" style="font-size:16px;padding:8px 14px">Random opponent</button>
    </div>
    <input class="search" id="search" placeholder="Search clubs or countries (e.g. ENG)" aria-label="Search clubs" autocomplete="off">
    <div class="grid" id="clubGrid"></div>
    <div class="actions"><button class="btn primary" id="btnKickoff">Kick Off ▸</button></div>
  </div>
</section>

<!-- Champions Cup bracket (filled in by modes.js) -->
<section class="screen hidden" id="scrCup">
  <div class="wrap" id="cupWrap"></div>
</section>

<!-- trophy celebration -->
<section class="screen center hidden" id="scrTrophy">
  <canvas id="confetti" aria-hidden="true"></canvas>
  <div class="card trophy-card">
    <svg class="trophy" viewBox="0 0 120 150" aria-hidden="true">
      <defs><linearGradient id="tg" x1="0" x2="1"><stop offset="0" stop-color="#b8892a"/><stop offset=".45" stop-color="#ffe7a3"/><stop offset="1" stop-color="#a87a1f"/></linearGradient></defs>
      <path d="M22 18 h76 v20 c0 26 -16 44 -38 48 c-22 -4 -38 -22 -38 -48z" fill="url(#tg)"/>
      <path d="M22 26 c-16 0 -18 26 4 34" fill="none" stroke="url(#tg)" stroke-width="7"/>
      <path d="M98 26 c16 0 18 26 -4 34" fill="none" stroke="url(#tg)" stroke-width="7"/>
      <rect x="54" y="86" width="12" height="22" fill="url(#tg)"/>
      <rect x="36" y="108" width="48" height="10" rx="2" fill="url(#tg)"/>
      <rect x="30" y="118" width="60" height="18" rx="3" fill="#2a1d0e"/>
      <text x="60" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#7a5512">★</text>
    </svg>
    <div class="optlbl">Futt Champions Cup winners</div>
    <div style="display:flex;align-items:center;gap:12px;justify-content:center"><span class="shirt" id="trophyKit" style="width:28px;height:36px;border-radius:5px;border:1px solid rgba(255,255,255,.4)"></span><h2 id="trophyTeam" style="font-size:40px"></h2></div>
    <p class="note" id="trophyNote"></p>
    <button class="btn primary" id="trophyDone">Back to the bracket</button>
  </div>
</section>

<!-- online lobby (filled in by net.js) -->
<section class="screen hidden" id="scrOnline">
  <div class="wrap" id="onlineWrap"></div>
</section>

<!-- controls -->
<section class="screen hidden" id="scrControls">
  <div class="wrap" id="controlsWrap"></div>
</section>

<!-- pause -->
<section class="screen center hidden" id="scrPause">
  <div class="card">
    <h2>Paused</h2>
    <button class="mbtn primary" id="btnResume">Resume</button>
    <button class="mbtn" id="btnRestart">Restart match</button>
    <button class="mbtn" id="btnPauseControls">Controls</button>
    <button class="mbtn" id="btnQuit">Quit to menu</button>
  </div>
</section>

<!-- full time -->
<section class="screen center hidden" id="scrFull">
  <div class="card">
    <div class="optlbl" style="text-align:center" id="ftLabel">Full time</div>
    <div class="result"><div class="t" id="ftH"></div><div class="s" id="ftScore"></div><div class="t" id="ftA"></div></div>
    <div class="scorers" id="ftScorers"></div>
    <table class="stats" id="ftStats"></table>
    <div class="menu" style="margin-top:4px" id="ftBtns"></div>
  </div>
</section>

<script src="../shared/lib/three.min.js"></script>
<script src="../shared/lib/peerjs.min.js"></script>
<script src="../shared/lib/ice.js"></script>
<script src="js/teams.js"></script>
<script src="js/flags.js"></script>
<script src="js/sim.js"></script>
<script src="js/render.js"></script>
<script src="js/audio.js"></script>
<script src="js/input.js"></script>
<script src="js/net.js"></script>
<script src="js/modes.js"></script>
<script src="js/controls.js"></script>
<script src="js/app.js"></script>
</body>
</html>
